{% extends "base.html" %}
{% block title %}{{ item.title }} — learnpath-agent{% endblock %}
{% block content %}
<article class="lesson">
  <p class="eyebrow">{{ item.track.value }} &middot; {{ item.level.value }}</p>
  <h1>{{ item.title }}</h1>
  <p class="content">{{ item.content }}</p>
</article>

{% if item.quiz %}
<p class="quiz-cta">
  <a class="quiz-cta-link" href="/item/{{ track_id }}/{{ item.id }}/quiz">Take the quiz →</a>
</p>
{% endif %}
{% endblock %}
