<svg class="diagram-cache-savings-bars" viewBox="0 0 720 245" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cache-savings-bars-title">
  <title id="cache-savings-bars-title">A 2000-token stable prefix plus a 100-token variable suffix costs about $0.0063 per call uncached, but roughly 86% less once the stable prefix is served from cache on repeat calls</title>
  <style>
    .cs-bar-before { fill: var(--surface); stroke: var(--ink-muted); stroke-width: 2; }
    .cs-bar-after { fill: var(--taken-tint); stroke: var(--taken); stroke-width: 2.25; }
    .cs-axis { stroke: var(--ink-muted); stroke-width: 1.5; }
    .cs-cost-label { font-family: var(--font-mono); font-size: 12px; fill: var(--ink); }
    .cs-cost-label-after { font-family: var(--font-mono); font-size: 12px; fill: var(--taken); font-weight: 600; }
    .cs-category-label { font-family: var(--font-body); font-size: 11.5px; fill: var(--ink-muted); }
    .cs-caption { font-family: var(--font-body); font-size: 11px; fill: var(--ink-muted); }
  </style>

  <line class="cs-axis" x1="150" y1="200" x2="600" y2="200"/>

  <rect class="cs-bar-before" x="220" y="20" width="100" height="180"/>
  <text class="cs-cost-label" x="270" y="12" text-anchor="middle">~$0.0063 / call</text>
  <text class="cs-category-label" x="270" y="220" text-anchor="middle">Without caching</text>

  <rect class="cs-bar-after" x="420" y="174" width="100" height="26"/>
  <text class="cs-cost-label-after" x="470" y="148" text-anchor="middle">~$0.0009 / call</text>
  <text class="cs-cost-label-after" x="470" y="162" text-anchor="middle">(-86%)</text>
  <text class="cs-category-label" x="470" y="220" text-anchor="middle">With caching (2nd+ call)</text>

  <text class="cs-caption" x="360" y="238" text-anchor="middle">2000-token stable prefix cached at ~90% off -- the 100-token variable suffix stays full price</text>
</svg>
