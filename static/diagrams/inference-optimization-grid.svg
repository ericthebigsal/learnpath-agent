<svg class="diagram-inference-optimization-grid" viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inference-optimization-grid-title">
  <title id="inference-optimization-grid-title">Four techniques make production inference affordable: KV caching avoids recomputing attention, batching parallelizes requests, quantization shrinks memory footprint, and speculative decoding verifies several tokens per memory pass</title>
  <style>
    .ig-box { fill: var(--surface); stroke-width: 2; }
    .ig-box-a { stroke: var(--taken); }
    .ig-box-b { stroke: var(--considered); }
    .ig-title { font-family: var(--font-display); font-weight: 600; font-size: 14px; fill: var(--ink); }
    .ig-sub { font-family: var(--font-body); font-size: 10.5px; fill: var(--ink-muted); }
  </style>

  <rect class="ig-box ig-box-a" x="40" y="20" width="310" height="85" rx="8"/>
  <text class="ig-title" x="195" y="52" text-anchor="middle">KV Caching</text>
  <text class="ig-sub" x="195" y="72" text-anchor="middle">reuse past attention,</text>
  <text class="ig-sub" x="195" y="87" text-anchor="middle">avoid recomputing from scratch</text>

  <rect class="ig-box ig-box-b" x="370" y="20" width="310" height="85" rx="8"/>
  <text class="ig-title" x="525" y="52" text-anchor="middle">Batching</text>
  <text class="ig-sub" x="525" y="72" text-anchor="middle">parallel requests,</text>
  <text class="ig-sub" x="525" y="87" text-anchor="middle">higher throughput per GPU</text>

  <rect class="ig-box ig-box-b" x="40" y="115" width="310" height="85" rx="8"/>
  <text class="ig-title" x="195" y="147" text-anchor="middle">Quantization</text>
  <text class="ig-sub" x="195" y="167" text-anchor="middle">lower weight precision,</text>
  <text class="ig-sub" x="195" y="182" text-anchor="middle">smaller and faster</text>

  <rect class="ig-box ig-box-a" x="370" y="115" width="310" height="85" rx="8"/>
  <text class="ig-title" x="525" y="147" text-anchor="middle">Speculative Decoding</text>
  <text class="ig-sub" x="525" y="167" text-anchor="middle">small model drafts,</text>
  <text class="ig-sub" x="525" y="182" text-anchor="middle">large model verifies in one pass</text>
</svg>
