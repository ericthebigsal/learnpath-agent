<svg class="diagram-communication-patterns" viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="communication-patterns-title">
  <title id="communication-patterns-title">Three ways agents pass state: a shared blackboard all agents read and write, direct point-to-point message passing, and a structured handoff object passed between agents instead of raw transcript</title>
  <style>
    .cm-panel-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.015em; fill: var(--ink-muted); }
    .cm-node { fill: var(--surface); stroke: var(--taken); stroke-width: 2; }
    .cm-store { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; }
    .cm-schema { fill: var(--considered-tint); stroke: var(--considered); stroke-width: 2; }
    .cm-node-label { font-family: var(--font-body); font-size: 9.5px; fill: var(--ink); }
    .cm-schema-label { font-family: var(--font-mono); font-size: 8.5px; fill: var(--considered); }
    .cm-link { stroke: var(--ink-muted); stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
    .cm-arrow { stroke: var(--ink-muted); stroke-width: 1.75; fill: none; }
    .cm-arrowhead { fill: var(--ink-muted); }
    .cm-edge-label { font-family: var(--font-body); font-size: 9px; fill: var(--ink-muted); }
  </style>

  <text class="cm-panel-label" x="120" y="20" text-anchor="middle">SHARED BLACKBOARD</text>
  <line class="cm-link" x1="135" y1="55" x2="100" y2="94"/>
  <line class="cm-link" x1="60" y1="150" x2="93" y2="122"/>
  <line class="cm-link" x1="205" y1="150" x2="167" y2="122"/>
  <rect class="cm-store" x="90" y="90" width="90" height="42" rx="6"/>
  <text class="cm-node-label" x="135" y="108" text-anchor="middle">Shared</text>
  <text class="cm-node-label" x="135" y="120" text-anchor="middle">store</text>
  <circle class="cm-node" cx="135" cy="42" r="15"/>
  <text class="cm-node-label" x="135" y="45" text-anchor="middle">Agent</text>
  <circle class="cm-node" cx="60" cy="160" r="15"/>
  <text class="cm-node-label" x="60" y="163" text-anchor="middle">Agent</text>
  <circle class="cm-node" cx="205" cy="160" r="15"/>
  <text class="cm-node-label" x="205" y="163" text-anchor="middle">Agent</text>

  <line x1="240" y1="10" x2="240" y2="210" stroke="var(--border)" stroke-width="1"/>

  <text class="cm-panel-label" x="360" y="20" text-anchor="middle">DIRECT MESSAGE</text>
  <circle class="cm-node" cx="300" cy="110" r="20"/>
  <text class="cm-node-label" x="300" y="113" text-anchor="middle">Agent A</text>
  <path class="cm-arrow" d="M320,110 L396,110"/>
  <path class="cm-arrowhead" d="M396,110 L385,105 L385,115 Z"/>
  <circle class="cm-node" cx="420" cy="110" r="20"/>
  <text class="cm-node-label" x="420" y="113" text-anchor="middle">Agent B</text>
  <text class="cm-edge-label" x="358" y="145" text-anchor="middle">A's output = B's input</text>

  <line x1="475" y1="10" x2="475" y2="210" stroke="var(--border)" stroke-width="1"/>

  <text class="cm-panel-label" x="595" y="20" text-anchor="middle">STRUCTURED HANDOFF</text>
  <circle class="cm-node" cx="505" cy="110" r="16"/>
  <text class="cm-node-label" x="505" y="113" text-anchor="middle">Agent A</text>
  <path class="cm-arrow" d="M521,110 L556,110"/>
  <path class="cm-arrowhead" d="M556,110 L547,106 L547,114 Z"/>
  <rect class="cm-schema" x="560" y="85" width="100" height="50" rx="6"/>
  <text class="cm-schema-label" x="610" y="103" text-anchor="middle">findings: [...]</text>
  <text class="cm-schema-label" x="610" y="115" text-anchor="middle">open_questions: [...]</text>
  <text class="cm-schema-label" x="610" y="127" text-anchor="middle">confidence: 0.8</text>
  <path class="cm-arrow" d="M660,110 L679,110"/>
  <path class="cm-arrowhead" d="M679,110 L670,106 L670,114 Z"/>
  <circle class="cm-node" cx="697" cy="110" r="16"/>
  <text class="cm-node-label" x="697" y="113" text-anchor="middle">Agent B</text>
</svg>
