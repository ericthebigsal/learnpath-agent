<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text {
        font-family: var(--font-body);
        fill: var(--ink);
      }
      .label-main {
        font-size: 15px;
        font-weight: 600;
      }
      .label-small {
        font-size: 12px;
        fill: var(--ink-muted);
      }
      .label-attack {
        font-size: 13px;
        font-style: italic;
        font-weight: 500;
      }
      .box {
        stroke: var(--border);
        stroke-width: 2;
        fill: var(--surface);
      }
      .guardrail {
        fill: var(--taken-tint);
        stroke: var(--taken);
        stroke-width: 2;
      }
      .model-box {
        fill: var(--surface);
        stroke: var(--ink-muted);
        stroke-width: 2;
      }
      .arrow {
        stroke: var(--ink);
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrowhead);
      }
      .attack-arrow {
        stroke: var(--signal);
        stroke-width: 2;
        fill: none;
        stroke-dasharray: 5,5;
        marker-end: url(#arrowhead-attack);
      }
      .hidden-text {
        display: none;
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="var(--ink)" />
    </marker>
    <marker id="arrowhead-attack" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="var(--signal)" />
    </marker>
  </defs>

  <title>Guardrail Defense Layers and Attack Vectors</title>

  <!-- Background -->
  <rect width="1000" height="580" fill="var(--surface)"/>

  <!-- Main defense pipeline -->
  <!-- User Input -->
  <rect x="30" y="200" width="130" height="90" class="box" rx="5"/>
  <text x="95" y="235" text-anchor="middle" class="label-main">User Input</text>
  <text x="95" y="265" text-anchor="middle" class="label-small">(prompt, image,</text>
  <text x="95" y="280" text-anchor="middle" class="label-small">or query)</text>

  <!-- Input Guardrails -->
  <rect x="190" y="200" width="150" height="90" class="guardrail" rx="5"/>
  <text x="265" y="230" text-anchor="middle" class="label-main">Input Filters</text>
  <text x="265" y="250" text-anchor="middle" class="label-small">(detect prompt</text>
  <text x="265" y="265" text-anchor="middle" class="label-small">injection, obvious</text>
  <text x="265" y="280" text-anchor="middle" class="label-small">attacks)</text>

  <!-- Model -->
  <rect x="370" y="200" width="130" height="90" class="model-box" rx="5"/>
  <text x="435" y="235" text-anchor="middle" class="label-main">Model</text>
  <text x="435" y="260" text-anchor="middle" class="label-small">(inference)</text>

  <!-- Output Guardrails -->
  <rect x="530" y="200" width="150" height="90" class="guardrail" rx="5"/>
  <text x="605" y="230" text-anchor="middle" class="label-main">Output Filters</text>
  <text x="605" y="250" text-anchor="middle" class="label-small">(detect toxic,</text>
  <text x="605" y="265" text-anchor="middle" class="label-small">harmful, or false</text>
  <text x="605" y="280" text-anchor="middle" class="label-small">outputs)</text>

  <!-- User Output -->
  <rect x="710" y="200" width="130" height="90" class="box" rx="5"/>
  <text x="775" y="235" text-anchor="middle" class="label-main">User Gets</text>
  <text x="775" y="260" text-anchor="middle" class="label-small">Response</text>

  <!-- Main flow arrows -->
  <path class="arrow" d="M 160 245 L 190 245"/>
  <path class="arrow" d="M 340 245 L 370 245"/>
  <path class="arrow" d="M 500 245 L 530 245"/>
  <path class="arrow" d="M 680 245 L 710 245"/>

  <!-- Attack Vectors -->

  <!-- 1. Prompt Injection (targets input) -->
  <path class="attack-arrow" d="M 90 170 Q 120 120 240 200"/>
  <text x="100" y="150" class="label-attack" fill="var(--signal)">Prompt Injection</text>
  <text x="100" y="165" class="label-small" fill="var(--signal)" font-style="italic">(hide malicious</text>
  <text x="100" y="178" class="label-small" fill="var(--signal)" font-style="italic">instructions)</text>

  <!-- 2. Roleplay/Jailbreak (targets model reasoning) -->
  <path class="attack-arrow" d="M 310 180 L 380 200"/>
  <text x="320" y="160" class="label-attack" fill="var(--signal)">Roleplay/Jailbreak</text>
  <text x="320" y="175" class="label-small" fill="var(--signal)" font-style="italic">(reframe request)</text>

  <!-- 3. Backdoor/Poisoning (targets model internals) -->
  <path class="attack-arrow" d="M 435 160 L 435 200"/>
  <text x="460" y="150" class="label-attack" fill="var(--signal)">Backdoor/</text>
  <text x="460" y="165" class="label-attack" fill="var(--signal)">Poisoning</text>
  <text x="460" y="180" class="label-small" fill="var(--signal)" font-style="italic">(training-time</text>
  <text x="460" y="192" class="label-small" fill="var(--signal)" font-style="italic">vulnerability)</text>

  <!-- 4. Adversarial Examples (targets output) -->
  <path class="attack-arrow" d="M 680 170 Q 650 150 610 200"/>
  <text x="680" y="140" class="label-attack" fill="var(--signal)">Adversarial</text>
  <text x="680" y="155" class="label-attack" fill="var(--signal)">Examples</text>
  <text x="680" y="170" class="label-small" fill="var(--signal)" font-style="italic">(crafted inputs</text>
  <text x="680" y="182" class="label-small" fill="var(--signal)" font-style="italic">bypass classifiers)</text>

  <!-- Legend Section -->
  <g id="legend">
    <text x="30" y="360" class="label-main">How Guardrails Work (and Fail)</text>

    <!-- Defense Layers -->
    <rect x="30" y="380" width="350" height="160" fill="none" stroke="var(--border)" stroke-width="1" rx="4"/>
    <text x="50" y="400" class="label-main">Defense Layers</text>

    <rect x="50" y="415" width="16" height="16" class="guardrail" rx="2"/>
    <text x="75" y="427" class="label-body">Input filters catch prompt injection and suspicious patterns before processing</text>

    <rect x="50" y="450" width="16" height="16" class="model-box" rx="2"/>
    <text x="75" y="462" class="label-body">Model training reduces (but doesn't eliminate) harmful generation tendencies</text>

    <rect x="50" y="485" width="16" height="16" class="guardrail" rx="2"/>
    <text x="75" y="497" class="label-body">Output filters catch toxic or clearly harmful content before user sees it</text>

    <rect x="50" y="520" width="16" height="16" class="box" rx="2"/>
    <text x="75" y="532" class="label-body">No single layer is perfect; layers complement each other</text>

    <!-- Attack Reality -->
    <rect x="420" y="380" width="520" height="160" fill="none" stroke="var(--border)" stroke-width="1" rx="4"/>
    <text x="440" y="400" class="label-main">Why Attacks Succeed</text>

    <circle cx="460" cy="425" r="4" fill="var(--signal)"/>
    <text x="475" y="430" class="label-body">Guardrails often have brittle failure modes -- one creative framing defeats months of work</text>

    <circle cx="460" cy="463" r="4" fill="var(--signal)"/>
    <text x="475" y="468" class="label-body">Attackers focus on finding the crack that works; defenders must block all cracks</text>

    <circle cx="460" cy="501" r="4" fill="var(--signal)"/>
    <text x="475" y="506" class="label-body">New attack techniques spread through communities faster than defenses can deploy</text>

    <circle cx="460" cy="539" r="4" fill="var(--signal)"/>
    <text x="475" y="544" class="label-body">Red-teaming (deliberately attacking your own system) catches many vulnerabilities early</text>
  </g>
</svg>
