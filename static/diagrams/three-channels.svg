<svg class="diagram-three-channels" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="three-channels-title">
  <title id="three-channels-title">System messages, user messages, and conversation history are three distinct channels that all flow into the same context window, but models weight them differently</title>
  <style>
    .tc-box { fill: var(--surface); stroke-width: 2; }
    .tc-box-source { stroke: var(--taken); }
    .tc-box-window { stroke: var(--ink); stroke-width: 2.5; }
    .tc-title { font-family: var(--font-display); font-weight: 600; font-size: 13px; fill: var(--ink); }
    .tc-sub { font-family: var(--font-body); font-size: 10px; fill: var(--ink-muted); }
    .tc-arrow { stroke: var(--ink-muted); stroke-width: 1.75; fill: none; }
    .tc-arrowhead { fill: var(--ink-muted); }
  </style>

  <rect class="tc-box tc-box-source" x="30" y="20" width="170" height="50" rx="8"/>
  <text class="tc-title" x="115" y="42" text-anchor="middle">System</text>
  <text class="tc-sub" x="115" y="58" text-anchor="middle">persona, rules, constraints</text>

  <rect class="tc-box tc-box-source" x="30" y="95" width="170" height="50" rx="8"/>
  <text class="tc-title" x="115" y="117" text-anchor="middle">User</text>
  <text class="tc-sub" x="115" y="133" text-anchor="middle">the task at hand</text>

  <rect class="tc-box tc-box-source" x="30" y="170" width="170" height="50" rx="8"/>
  <text class="tc-title" x="115" y="192" text-anchor="middle">History</text>
  <text class="tc-sub" x="115" y="208" text-anchor="middle">prior turns discussed</text>

  <path class="tc-arrow" d="M200,45 L386,115"/>
  <path class="tc-arrowhead" d="M386,115 L378,109 L374,118 Z"/>
  <path class="tc-arrow" d="M200,120 L390,130"/>
  <path class="tc-arrowhead" d="M390,130 L381,126 L380,135 Z"/>
  <path class="tc-arrow" d="M200,195 L386,145"/>
  <path class="tc-arrowhead" d="M386,145 L377,146 L380,155 Z"/>

  <rect class="tc-box tc-box-window" x="390" y="95" width="220" height="70" rx="8"/>
  <text class="tc-title" x="500" y="125" text-anchor="middle">Context window</text>
  <text class="tc-sub" x="500" y="145" text-anchor="middle">what the model actually sees,</text>
  <text class="tc-sub" x="500" y="158" text-anchor="middle">weighted differently by channel</text>
</svg>
