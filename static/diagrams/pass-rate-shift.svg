<svg class="diagram-pass-rate-shift" viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pass-rate-shift-title">
  <title id="pass-rate-shift-title">A change that raises the overall pass rate from 82% to 88% can still make a couple of previously-passing cases newly fail, which only a consistent test set run on every change would catch</title>
  <style>
    .pr-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em; fill: var(--ink-muted); }
    .pr-pass { fill: var(--taken-tint); stroke: var(--taken); stroke-width: 1.5; }
    .pr-fail { fill: var(--surface); stroke: var(--ink-muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .pr-flip { fill: var(--signal); }
    .pr-caption { font-family: var(--font-body); font-size: 11px; fill: var(--signal); }
  </style>

  <text class="pr-label" x="40" y="30">BEFORE: 82% PASSING</text>
  <rect class="pr-pass" x="40" y="40" width="525" height="40"/>
  <rect class="pr-fail" x="565" y="40" width="115" height="40"/>

  <text class="pr-label" x="40" y="100">AFTER: 88% PASSING</text>
  <rect class="pr-pass" x="40" y="110" width="563" height="40"/>
  <rect class="pr-fail" x="603" y="110" width="77" height="40"/>
  <rect class="pr-flip" x="470" y="110" width="6" height="40"/>
  <rect class="pr-flip" x="520" y="110" width="6" height="40"/>

  <text class="pr-caption" x="40" y="165">Two cases that passed before now fail, hidden inside the higher average</text>
</svg>
