<svg class="diagram-parallel-tool-calls" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="parallel-tool-calls-title">
  <title id="parallel-tool-calls-title">A model can request several independent tool calls in a single turn, which your code can potentially execute in parallel before merging the results back</title>
  <style>
    .pt-box { fill: var(--surface); stroke-width: 2; }
    .pt-box-model { stroke: var(--ink); stroke-width: 2.5; }
    .pt-box-call { stroke: var(--taken); }
    .pt-title { font-family: var(--font-display); font-weight: 600; font-size: 12.5px; fill: var(--ink); }
    .pt-sub { font-family: var(--font-body); font-size: 10px; fill: var(--ink-muted); }
    .pt-arrow { stroke: var(--ink-muted); stroke-width: 1.75; fill: none; }
    .pt-arrowhead { fill: var(--ink-muted); }
  </style>

  <rect class="pt-box pt-box-model" x="20" y="90" width="150" height="60" rx="8"/>
  <text class="pt-title" x="95" y="116" text-anchor="middle">Model</text>
  <text class="pt-sub" x="95" y="134" text-anchor="middle">requests 3 calls at once</text>

  <path class="pt-arrow" d="M170,105 L246,42"/>
  <path class="pt-arrowhead" d="M246,42 L237,44 L241,53 Z"/>
  <path class="pt-arrow" d="M170,120 L246,120"/>
  <path class="pt-arrowhead" d="M246,120 L237,116 L237,124 Z"/>
  <path class="pt-arrow" d="M170,135 L246,198"/>
  <path class="pt-arrowhead" d="M246,198 L242,189 L233,193 Z"/>

  <rect class="pt-box pt-box-call" x="250" y="15" width="160" height="50" rx="8"/>
  <text class="pt-title" x="330" y="36" text-anchor="middle">Tool call 1</text>
  <text class="pt-sub" x="330" y="52" text-anchor="middle">runs independently</text>

  <rect class="pt-box pt-box-call" x="250" y="95" width="160" height="50" rx="8"/>
  <text class="pt-title" x="330" y="116" text-anchor="middle">Tool call 2</text>
  <text class="pt-sub" x="330" y="132" text-anchor="middle">runs independently</text>

  <rect class="pt-box pt-box-call" x="250" y="175" width="160" height="50" rx="8"/>
  <text class="pt-title" x="330" y="196" text-anchor="middle">Tool call 3</text>
  <text class="pt-sub" x="330" y="212" text-anchor="middle">runs independently</text>

  <path class="pt-arrow" d="M410,42 L486,105"/>
  <path class="pt-arrowhead" d="M486,105 L482,96 L473,100 Z"/>
  <path class="pt-arrow" d="M410,120 L486,120"/>
  <path class="pt-arrowhead" d="M486,120 L477,116 L477,124 Z"/>
  <path class="pt-arrow" d="M410,198 L486,135"/>
  <path class="pt-arrowhead" d="M486,135 L477,139 L481,148 Z"/>

  <rect class="pt-box pt-box-model" x="490" y="90" width="180" height="60" rx="8"/>
  <text class="pt-title" x="580" y="116" text-anchor="middle">Results merged</text>
  <text class="pt-sub" x="580" y="134" text-anchor="middle">fed back to the model</text>
</svg>
