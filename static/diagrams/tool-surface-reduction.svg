    <circle class="ts-dot" cx="40" cy="68" r="4"/><circle class="ts-dot" cx="58" cy="68" r="4"/><circle class="ts-dot" cx="76" cy="68" r="4"/><circle class="ts-dot" cx="94" cy="68" r="4"/><circle class="ts-dot" cx="112" cy="68" r="4"/><circle class="ts-dot" cx="130" cy="68" r="4"/><circle class="ts-dot" cx="148" cy="68" r="4"/><circle class="ts-dot" cx="166" cy="68" r="4"/><circle class="ts-dot" cx="184" cy="68" r="4"/><circle class="ts-dot" cx="202" cy="68" r="4"/>
    <circle class="ts-dot" cx="40" cy="86" r="4"/><circle class="ts-dot" cx="58" cy="86" r="4"/><circle class="ts-dot" cx="76" cy="86" r="4"/><circle class="ts-dot" cx="94" cy="86" r="4"/><circle class="ts-dot" cx="112" cy="86" r="4"/><circle class="ts-dot" cx="130" cy="86" r="4"/><circle class="ts-dot" cx="148" cy="86" r="4"/><circle class="ts-dot" cx="166" cy="86" r="4"/><circle class="ts-dot" cx="184" cy="86" r="4"/><circle class="ts-dot" cx="202" cy="86" r="4"/>
    <circle class="ts-dot" cx="40" cy="104" r="4"/><circle class="ts-dot" cx="58" cy="104" r="4"/><circle class="ts-dot" cx="76" cy="104" r="4"/><circle class="ts-dot" cx="94" cy="104" r="4"/><circle class="ts-dot" cx="112" cy="104" r="4"/><circle class="ts-dot" cx="130" cy="104" r="4"/><circle class="ts-dot" cx="148" cy="104" r="4"/><circle class="ts-dot" cx="166" cy="104" r="4"/><circle class="ts-dot" cx="184" cy="104" r="4"/><circle class="ts-dot" cx="202" cy="104" r="4"/>
    <circle class="ts-dot" cx="40" cy="122" r="4"/><circle class="ts-dot" cx="58" cy="122" r="4"/><circle class="ts-dot" cx="76" cy="122" r="4"/><circle class="ts-dot" cx="94" cy="122" r="4"/><circle class="ts-dot" cx="112" cy="122" r="4"/><circle class="ts-dot" cx="130" cy="122" r="4"/><circle class="ts-dot" cx="148" cy="122" r="4"/><circle class="ts-dot" cx="166" cy="122" r="4"/><circle class="ts-dot" cx="184" cy="122" r="4"/><circle class="ts-dot" cx="202" cy="122" r="4"/>
