<svg class="diagram-tool-surface-reduction" viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tool-surface-reduction-title">
  <title id="tool-surface-reduction-title">Tool retrieval, hierarchical routing, and toolset grouping all work the same way: shrinking a flat list of dozens of tools down to only the handful relevant to the current request</title>
  <style>
    .ts-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.02em; fill: var(--ink-muted); }
    .ts-dot { fill: var(--ink-muted); opacity: 0.55; }
    .ts-dot-relevant { fill: var(--taken); }
    .ts-arrow { stroke: var(--ink-muted); stroke-width: 1.75; fill: none; }
    .ts-arrowhead { fill: var(--ink-muted); }
    .ts-edge-label { font-family: var(--font-body); font-size: 10px; fill: var(--ink-muted); }
  </style>

  <text class="ts-label" x="135" y="25" text-anchor="middle">ALL 50 TOOLS -- FLAT LIST</text>

