  <path class="ts-arrow" d="M232,86 L398,86"/>
  <path class="ts-arrowhead" d="M398,86 L389,81 L389,91 Z"/>
  <text class="ts-edge-label" x="315" y="72" text-anchor="middle">retrieval / routing /</text>
  <text class="ts-edge-label" x="315" y="105" text-anchor="middle">toolset grouping</text>

  <text class="ts-label" x="585" y="25" text-anchor="middle">RELEVANT SUBSET (~5)</text>
