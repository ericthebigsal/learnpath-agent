<svg class="diagram-federated-swarms" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="federated-swarms-title">
  <title id="federated-swarms-title">Federated Swarms pattern features a central orchestrator delegating macro-tasks to specialized sub-swarms, which execute locally via mesh networks</title>
  <style>
    .fs-panel-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em; fill: var(--ink-muted); }
    .fs-swarm-box { fill: none; stroke: var(--border); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .fs-swarm-label { font-family: var(--font-mono); font-size: 10px; font-weight: 600; fill: var(--ink-muted); }
    .fs-node { fill: var(--surface); stroke: var(--taken); stroke-width: 2; }
    .fs-node-center { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; }
    .fs-node-label { font-family: var(--font-body); font-size: 10px; fill: var(--ink); }
    .fs-node-label-center { font-family: var(--font-display); font-weight: 600; font-size: 11px; fill: var(--ink); }
    .fs-delegate { stroke: var(--ink-muted); stroke-width: 1.75; fill: none; }
    .fs-arrowhead { fill: var(--ink-muted); }
    .fs-mesh { stroke: var(--considered); stroke-width: 1.25; stroke-dasharray: 3 3; fill: none; }
  </style>

  <!-- Central Orchestrator -->
  <circle class="fs-node-center" cx="100" cy="120" r="24"/>
  <text class="fs-node-label-center" x="100" y="124" text-anchor="middle">Orchestrator</text>

  <!-- Connections from Orchestrator to Sub-Swarms -->
  <path class="fs-delegate" d="M124,110 L290,70"/>
  <path class="fs-arrowhead" d="M290,70 L280,68 L283,77 Z"/>

  <path class="fs-delegate" d="M124,130 L290,170"/>
  <path class="fs-arrowhead" d="M290,170 L283,163 L280,172 Z"/>

  <!-- Sub-Swarm A -->
  <rect class="fs-swarm-box" x="300" y="20" width="370" height="95" rx="8"/>
  <text class="fs-swarm-label" x="315" y="38">SUB-SWARM A: RESEARCH</text>

  <!-- Mesh connections within A -->
  <path class="fs-mesh" d="M380,75 L470,55"/>
  <path class="fs-mesh" d="M470,55 L560,75"/>
  <path class="fs-mesh" d="M380,75 L560,75"/>
  <path class="fs-mesh" d="M470,55 L610,65"/>
  <path class="fs-mesh" d="M560,75 L610,65"/>

  <!-- Sub-Swarm A Agents -->
  <circle class="fs-node" cx="380" cy="75" r="14"/>
  <text class="fs-node-label" x="380" y="78" text-anchor="middle">Agent 1</text>

  <circle class="fs-node" cx="470" cy="55" r="14"/>
  <text class="fs-node-label" x="470" y="58" text-anchor="middle">Agent 2</text>

  <circle class="fs-node" cx="560" cy="75" r="14"/>
  <text class="fs-node-label" x="560" y="78" text-anchor="middle">Agent 3</text>

  <circle class="fs-node" cx="610" cy="65" r="14"/>
  <text class="fs-node-label" x="610" y="68" text-anchor="middle">Agent 4</text>

  <!-- Sub-Swarm B -->
  <rect class="fs-swarm-box" x="300" y="125" width="370" height="95" rx="8"/>
  <text class="fs-swarm-label" x="315" y="143">SUB-SWARM B: ANALYSIS</text>

  <!-- Mesh connections within B -->
  <path class="fs-mesh" d="M380,180 L470,195"/>
  <path class="fs-mesh" d="M470,195 L560,180"/>
  <path class="fs-mesh" d="M380,180 L560,180"/>
  <path class="fs-mesh" d="M470,195 L610,175"/>
  <path class="fs-mesh" d="M560,180 L610,175"/>

  <!-- Sub-Swarm B Agents -->
  <circle class="fs-node" cx="380" cy="180" r="14"/>
  <text class="fs-node-label" x="380" y="183" text-anchor="middle">Agent 1</text>

  <circle class="fs-node" cx="470" cy="195" r="14"/>
  <text class="fs-node-label" x="470" y="198" text-anchor="middle">Agent 2</text>

  <circle class="fs-node" cx="560" cy="180" r="14"/>
  <text class="fs-node-label" x="560" y="183" text-anchor="middle">Agent 3</text>

  <circle class="fs-node" cx="610" cy="175" r="14"/>
  <text class="fs-node-label" x="610" y="178" text-anchor="middle">Agent 4</text>
</svg>
