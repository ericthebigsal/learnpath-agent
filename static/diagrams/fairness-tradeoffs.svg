<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fairness-tradeoffs-title">
  <title id="fairness-tradeoffs-title">The Impossibility Theorem: Demographic Parity, Equalized Odds, and Predictive Parity cannot all be satisfied at once when group base rates differ</title>
  <style>
    .ft-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--ink); }
    .ft-label { font-family: var(--font-display); font-size: 14px; font-weight: 600; fill: var(--ink); }
    .ft-sub { font-family: var(--font-body); font-size: 10.5px; fill: var(--ink-muted); }
    .ft-center { font-family: var(--font-body); font-size: 11.5px; fill: var(--ink-muted); }
    .ft-edge { stroke: var(--signal); stroke-width: 1.75; stroke-dasharray: 5 4; fill: none; }
    .ft-edge-label { font-family: var(--font-mono); font-size: 9.5px; fill: var(--signal); }
    .ft-node-a { fill: var(--taken-tint); stroke: var(--taken-border); stroke-width: 2; }
    .ft-node-b { fill: var(--considered-tint); stroke: var(--considered-border); stroke-width: 2; }
    .ft-node-c { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
  </style>

  <text x="350" y="30" text-anchor="middle" class="ft-title">Three Fairness Definitions, One Conflict</text>

  <!-- Triangle conflict edges -->
  <path class="ft-edge" d="M330,110 L170,330" />
  <path class="ft-edge" d="M370,110 L530,330" />
  <path class="ft-edge" d="M225,355 L475,355" />

  <text x="200" y="230" text-anchor="middle" class="ft-edge-label" transform="rotate(-58 200 230)">conflict</text>
  <text x="500" y="230" text-anchor="middle" class="ft-edge-label" transform="rotate(58 500 230)">conflict</text>
  <text x="350" y="345" text-anchor="middle" class="ft-edge-label">conflict</text>

  <!-- Top node: Demographic Parity -->
  <rect x="230" y="55" width="240" height="70" rx="10" class="ft-node-a" />
  <text x="350" y="82" text-anchor="middle" class="ft-label">Demographic Parity</text>
  <text x="350" y="100" text-anchor="middle" class="ft-sub">equal outcome rates across groups</text>

  <!-- Bottom-left node: Equalized Odds -->
  <rect x="30" y="330" width="240" height="70" rx="10" class="ft-node-b" />
  <text x="150" y="357" text-anchor="middle" class="ft-label">Equalized Odds</text>
  <text x="150" y="375" text-anchor="middle" class="ft-sub">equal error rates across groups</text>

  <!-- Bottom-right node: Predictive Parity -->
  <rect x="430" y="330" width="240" height="70" rx="10" class="ft-node-c" />
  <text x="550" y="357" text-anchor="middle" class="ft-label">Predictive Parity</text>
  <text x="550" y="375" text-anchor="middle" class="ft-sub">equal calibration across groups</text>

  <!-- Center note -->
  <text x="350" y="255" text-anchor="middle" class="ft-center">Cannot all hold at once</text>
  <text x="350" y="270" text-anchor="middle" class="ft-center">when group base rates differ</text>
</svg>
