services:
  - type: web
    name: learnpath-agent
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: GEMINI_API_KEY
        sync: false
      # Render's free plan has no persistent disk, so a local SQLite file
      # resets on every deploy. DB_PATH now doubles as a Postgres connection
      # string: set it in the Render dashboard to your Supabase project's
      # "Transaction" pooler connection string (Project Settings -> Database
      # -> Connection string -> Transaction pooler, port 6543 -- required
      # since this app opens a fresh connection per request rather than
      # pooling in-process). db.py auto-detects the postgres:// prefix and
      # switches backends; nothing else needs to change.
      - key: DB_PATH
        sync: false
